<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Maze Pro: 觉醒与重生</title>
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    <style>
        :root { --main-color: #00ff88; }
        body { margin: 0; overflow: hidden; background: #000; font-family: 'PingFang SC', sans-serif; color: white; }
        #stats { position: absolute; top: 40px; left: 20px; font-size: 16px; z-index: 10; color: var(--main-color); font-weight: bold; }
        #hp-bar { position: absolute; top: 40px; right: 20px; color: #ff0055; font-size: 18px; z-index: 10; }
        #overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.92); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 100; }
        .menu-card { background: #111; border: 2px solid var(--main-color); padding: 30px; border-radius: 25px; text-align: center; width: 80%; max-width: 400px; }
        .btn { background: var(--main-color); color: #000; border: none; padding: 15px; border-radius: 30px; font-weight: bold; margin: 10px 0; cursor: pointer; width: 100%; font-size: 18px; }
        .shop-container { display: flex; justify-content: space-around; gap: 10px; margin: 20px 0; }
        .skin-btn { border: 2px solid #333; padding: 10px; border-radius: 12px; font-size: 11px; width: 70px; }
        .active-skin { border-color: var(--main-color); background: rgba(0,255,136,0.1); }
        canvas { display: block; }
    </style>
</head>
<body>

    <div id="stats">LVL: <span id="lvl">1</span> | 💰: <span id="coins">0</span></div>
    <div id="hp-bar">❤️❤️❤️</div>

    <div id="overlay">
        <div class="menu-card">
            <h1>MAZE PRO</h1>
            <p id="msg">准备好开始了吗？</p >
            <div class="shop-container">
                <div class="skin-btn active-skin" onclick="selectSkin('#00ff88','Default',0)">🟢<br>基础型</div>
                <div class="skin-btn" onclick="selectSkin('#ff4500','Lava',10)">🔥<br>熔岩</div>
                <div class="skin-btn" onclick="selectSkin('#00d4ff','Ice',20)">❄️<br>冰晶</div>
            </div>
            <button class="btn" onclick="initGame()">进入连接</button>
            <button class="btn" style="background:#444;color:#fff" onclick="generatePoster()">保存战绩</button>
        </div>
    </div>

    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let state = {
            active: false,
            score: 0,
            level: parseInt(localStorage.getItem('maze_lvl')) || 1,
            coins: parseInt(localStorage.getItem('maze_coins')) || 0,
            hp: 3,
            invincible: 0, // 无敌帧计时
            skin: '#00ff88',
            skinType: 'Default'
        };

        let player = { x: 50, y: 50, r: 15, vx: 0, vy: 0 };
        let walls = [], items = [];

        function selectSkin(color, type, price) {
            if (state.coins < price) { alert("金币不足"); return; }
            state.skin = color; state.skinType = type;
            document.documentElement.style.setProperty('--main-color', color);
        }

        function createLevel() {
            walls = []; items = [];
            document.getElementById('lvl').innerText = state.level;
            document.getElementById('coins').innerText = state.coins;
            
            const wallCount = Math.min(state.level + 2, 8);
            for(let i=0; i<wallCount; i++) {
                let s = (state.skinType === 'Ice') ? 0.3 : 1;
                walls.push({ x: Math.random()*canvas.width*0.7, y: Math.random()*canvas.height*0.7, w: Math.random()>0.5?120:25, h: Math.random()>0.5?25:120, m: (Math.random()-0.5)*state.level*0.8*s });
            }
            spawnItem('target', '#ffd700');
            for(let i=0; i<Math.floor(state.level/3)+1; i++) spawnItem('enemy', '#ff0055');
        }

        function spawnItem(type, color) {
            items.push({ type, color, x: Math.random()*(canvas.width-40)+20, y: Math.random()*(canvas.height-40)+20, r: 12 });
        }

        function loop() {
            if(!state.active) return;
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // 物理
            player.vx *= 0.95; player.vy *= 0.95;
            player.x += player.vx; player.y += player.vy;
            player.x = Math.max(player.r, Math.min(canvas.width-player.r, player.x));
            player.y = Math.max(player.r, Math.min(canvas.height-player.r, player.y));

            if(state.invincible > 0) state.invincible--;

            // 墙壁
            walls.forEach((w, i) => {
                w.x += w.m; if(w.x<0 || w.x>canvas.width-w.w) w.m*=-1;
                if (player.x+player.r > w.x && player.x-player.r < w.x+w.w && player.y+player.r > w.y && player.y-player.r < w.y+w.h) {
                    if(state.skinType==='Lava' && Math.random()>0.8) walls.splice(i,1);
                    else { player.vx*=-1.2; player.vy*=-1.2; }
                }
                ctx.strokeStyle = state.skin; ctx.strokeRect(w.x, w.y, w.w, w.h);
            });

            // 物品
            items.forEach((it, i) => {
                if(Math.hypot(player.x-it.x, player.y-it.y) < player.r + it.r) {
                    if(it.type === 'target') {
                        state.score++; state.coins += 2; items.splice(i, 1);
                        if(state.score >= 3) { state.level++; state.score=0; localStorage.setItem('maze_lvl', state.level); localStorage.setItem('maze_coins', state.coins); createLevel(); }
                        else spawnItem('target', '#ffd700');
                    } else if(state.invincible <= 0) {
                        // 撞到红球
                        state.hp--;
                        state.invincible = 120; // 约2秒无敌
                        player.vx *= -2; player.vy *= -2;
                        if(window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
                        document.getElementById('hp-bar').innerText = "❤️".repeat(Math.max(0, state.hp));
                        if(state.hp <= 0) { alert("核心链路彻底断开！"); location.reload(); }
                    }
                }
                ctx.fillStyle = it.color; ctx.beginPath(); ctx.arc(it.x, it.y, it.r, 0, Math.PI*2); ctx.fill();
            });

            // 画玩家 (无敌时闪烁)
            if(state.invincible % 10 < 5) {
                ctx.fillStyle = state.skin; ctx.shadowBlur = 15; ctx.shadowColor = state.skin;
                ctx.beginPath(); ctx.arc(player.x, player.y, player.r, 0, Math.PI*2); ctx.fill();
                ctx.shadowBlur = 0;
            }
            requestAnimationFrame(loop);
        }

        function initGame() {
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(res => { if(res==='granted') start(); });
            } else { start(); }
        }

        function start() {
            document.getElementById('overlay').style.display = 'none';
            state.active = true;
            window.addEventListener('deviceorientation', e => {
                player.vx += e.gamma * 0.18; // 降低了灵敏度，更稳了
                player.vy += e.beta * 0.18;
            });
            createLevel();
            loop();
        }

        function generatePoster() { /* 保持之前的海报生成逻辑... */ }
    </script>
</body>
</html>
